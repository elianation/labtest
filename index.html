<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>מדריך בדיקות מעבדה</title>
  <!-- Link to the custom stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- Include SheetJS for parsing Excel files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>מדריך בדיקות מעבדה</h1>
    </header>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="חיפוש..." dir="rtl" />
    </div>
    <main>
      <div id="results"></div>
    </main>
  </div>

  <script>
    // Utility function: Checks if a string contains any Hebrew characters.
    function containsHebrew(text) {
      return /[\u0590-\u05FF]/.test(text);
    }

    // Global array to store Excel data
    let testData = [];

    // Load and parse the Excel file (ensure the file is in the same folder)
    fetch('מדריך-בדיקות-המעבדה-1.2020.xlsx')
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        testData = XLSX.utils.sheet_to_json(worksheet);
        displayResults(testData);
      })
      .catch(error => {
        console.error("Error loading Excel file:", error);
      });

    // Render the clickable cards for each test entry
    function displayResults(data) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      data.forEach((item) => {
        // Use "שם הבדיקה" as the key for test names
        const testName = item["שם הבדיקה"] || "Unnamed Test";
        const collectionValue = item["כלי איסוף"] || "";
        // Determine the text direction for the collection value
        const collectionDir = containsHebrew(collectionValue) ? "rtl" : "ltr";

        // Determine cap color based on "כלי איסוף" text (Hebrew color word)
        let capColor = "black";
        if (collectionValue.trim() !== "") {
          const collectionText = collectionValue.toLowerCase();
          const capColorMap = {
            "אדום": "#e74c3c",
            "כחול": "#3498db",
            "ירוק": "#2ecc71",
            "סגול": "#9b59b6",
            "צהוב": "#f1c40f",
            "כתום": "#e67e22",
            "ורוד": "#fd79a8",
            "חום": "#8d6e63",
            "אפור": "#95a5a6",
            "שחור": "#34495e",
            "לבן": "#ffffff",
            "שקוף": "transparent"
          };
          for (const color in capColorMap) {
            if (collectionText.includes(color)) {
              capColor = capColorMap[color];
              break;
            }
          }
        }

        // Create card container
        const card = document.createElement('div');
        card.className = 'card';

        // Build the card header
        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
          <div class="header-left">
            <span class="vial-container"></span>
            <div class="header-text">
              <span class="test-name" dir="auto">${testName}</span>
              <span class="test-collection" dir="${collectionDir}">${collectionValue}</span>
            </div>
          </div>
          <span class="arrow">&#9660;</span>
        `;

        // Insert the generated inline SVG test tube that mimics the provided image design
        const vialContainer = header.querySelector('.vial-container');
        vialContainer.innerHTML = `
          <svg width="40" height="80" viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
            <!-- Test tube cap: curved shape resembling the original vector icon -->
            <path d="M8,30 C12,18,28,18,32,30 L32,34 C28,26,12,26,8,34 Z" 
                  fill="var(--cap-color)" stroke="#ccc" stroke-width="1"/>
            <!-- Test tube body: with a slight curve and a white fill -->
            <path d="M10,34 L10,66 C10,70,15,74,20,74 C25,74,30,70,30,66 L30,34 Z" 
                  fill="#fff" stroke="#ccc" stroke-width="1"/>
            <!-- Blood inside the test tube -->
            <path d="M12,56 L12,66 C12,68,15,70,20,70 C25,70,28,68,28,66 L28,56 Z" 
                  fill="#e74c3c"/>
          </svg>
        `;
        // Set the cap color via CSS variable
        vialContainer.style.setProperty('--cap-color', capColor);

        // Toggle card active state on header click
        header.addEventListener('click', () => {
          card.classList.toggle('active');
        });

        // Create collapsible card body with details (excluding the test name)
        const body = document.createElement('div');
        body.className = 'card-body';
        body.setAttribute('dir', 'auto'); // auto direction for mixed content
        body.innerHTML = formatTestInfo(item);

        card.appendChild(header);
        card.appendChild(body);
        resultsDiv.appendChild(card);
      });
    }

    // Helper function: Format test information into paragraphs
    function formatTestInfo(item) {
      let info = "";
      for (const key in item) {
        // Exclude the test name column from the details
        if (key !== "שם הבדיקה") {
          info += `<p><strong>${key}:</strong> ${item[key]}</p>`;
        }
      }
      return info;
    }

    // Filter tests based on the search input using "שם הבדיקה"
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const filtered = testData.filter(item => 
        item["שם הבדיקה"] && item["שם הבדיקה"].toLowerCase().includes(query)
      );
      displayResults(filtered);
    });
  </script>
</body>
</html>
